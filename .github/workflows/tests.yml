name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Types et tests unitaires (EXIF, étapes, fuseaux, sauvegarde IndexedDB, carnet)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run types
      - run: npm run unit

  navigateur:
    name: Fumée, parcours complet, robustesse et 300 photos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run partie
      - run: npm run robustesse
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: test-results/
          retention-days: 7

  # Un seul contrôle à rendre obligatoire dans la protection de branche (Settings > Branches) : il échoue si un job échoue.
  verdict:
    name: CI Kevoyage
    if: always()
    needs: [unit, navigateur]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.unit.result }}" = success && test "${{ needs.navigateur.result }}" = success
